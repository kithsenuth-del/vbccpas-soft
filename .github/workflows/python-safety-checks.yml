name: Python and passkey safety checks

on:
  push:
    branches:
      - main
      - feature/executive-admin-passkey
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile main.py server.py passkey_auth.py run_server.py verify_data_flow.py check_frontend.py
      - name: Verify local-only passkey access controls
        run: python verify_data_flow.py
      - name: Check dashboard JavaScript syntax
        run: python check_frontend.py
