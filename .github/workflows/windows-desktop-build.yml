name: VBCCPAS Windows desktop build

permissions:
  contents: read

on:
  push:
    branches:
      - feature/unified-windows-ui
      - feature/photographic-arts-theme
      - feature/one-click-windows-launcher
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt -r cloud_api/requirements.txt httpx==0.28.1
      - name: Compile Python modules
        run: python -m py_compile main.py desktop_app.py server.py passkey_auth.py problem_checker.py updater.py build_info.py test_integration.py database_migrations.py local_sync.py cloud_api/app.py cloud_api/bootstrap_admin.py tests/test_database_migrations.py tests/test_local_sync.py tests/test_cloud_api.py tests/test_passkey_recovery.py tests/test_updater.py tests/test_updater_package.py updater_app.py
      - name: Run isolated integration tests
        run: python test_integration.py
      - name: Test safe passkey registration recovery
        run: python tests/test_passkey_recovery.py
      - name: Test automatic updater release validation
        run: python tests/test_updater.py
      - name: Test safe full-application package extraction
        run: python tests/test_updater_package.py
      - name: Test non-destructive database migration foundation
        run: python -m unittest discover -s tests -p "test_database_migrations.py" -v
      - name: Test local-first sync engine
        run: python -m unittest discover -s tests -p "test_local_sync.py" -v
      - name: Test central API and device sync protocol
        run: python -m unittest discover -s tests -p "test_cloud_api.py" -v
      - name: Run passkey safety checks
        run: python verify_data_flow.py
      - name: Check dashboard JavaScript
        run: python check_frontend.py

  windows-build:
    needs: integration
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run verified local Windows build script
        shell: pwsh
        run: .\build_exes.ps1
      - name: Verify Windows desktop shortcut creation
        shell: pwsh
        run: |
          $shortcut = Join-Path $env:RUNNER_TEMP "VBCCPAS-Soft-test.lnk"
          ./Create-Desktop-Shortcut.ps1 -TargetExe "$PWD/dist/VBCCPAS-Soft.exe" -ShortcutPath $shortcut
          if (-not (Test-Path -LiteralPath $shortcut -PathType Leaf)) { throw "Shortcut was not created." }
      - name: Upload verified Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: VBCCPAS-Soft-Windows-release
          path: |
            dist/VBCCPAS-Soft-Windows.zip
            dist/VBCCPAS-Soft-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: windows-build
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: VBCCPAS-Soft-Windows-release
          path: release-assets
      - name: Re-verify checksum and complete ZIP before publishing
        id: verify-package
        shell: pwsh
        run: |
          $zip = Join-Path $PWD "release-assets/VBCCPAS-Soft-Windows.zip"
          $checksum = $zip + ".sha256"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Verified Windows ZIP is missing." }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) { throw "Windows ZIP SHA-256 sidecar is missing." }
          $actualHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedLine = $actualHash + "  VBCCPAS-Soft-Windows.zip"
          $checksumLine = (Get-Content -LiteralPath $checksum -Raw).Trim()
          if ($checksumLine -ne $expectedLine) { throw "Windows ZIP SHA-256 sidecar does not match the package." }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $fileEntries = @($archive.Entries | Where-Object { -not $_.FullName.EndsWith('/') } | ForEach-Object { $_.FullName })
            $required = @("VBCCPAS-Soft.exe", "VBCCPAS-Updater.exe", "updater.ps1", "Recover-VBCCPAS.bat", "vbccpas-managed-files.json")
            foreach ($name in $required) {
              if ($fileEntries -notcontains $name) { throw "Windows ZIP is incomplete; missing $name." }
            }
            $manifestEntry = $archive.GetEntry("vbccpas-managed-files.json")
            $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            if ($manifest.schema_version -ne 1 -or $null -eq $manifest.files) { throw "Windows ZIP manifest is invalid." }
            $managedFiles = @($manifest.files)
            $actualManagedFiles = @($fileEntries | Where-Object { $_ -ne "vbccpas-managed-files.json" })
            $unexpected = @($actualManagedFiles | Where-Object { $managedFiles -notcontains $_ })
            if ($unexpected.Count -gt 0 -or $managedFiles.Count -ne $actualManagedFiles.Count) {
              throw "Windows ZIP entries do not exactly match the managed-file manifest."
            }
            $protected = @($actualManagedFiles | Where-Object { $_ -match '(^|/)(society\.db(?:-(?:wal|shm|journal))?|backups|exports|logs|user-data|user_data|\.vbccpas-data)(/|$)' })
            if ($protected.Count -gt 0) { throw ("Windows ZIP contains protected user data: " + ($protected -join ", ")) }
            foreach ($entry in $archive.Entries) {
              if ($entry.FullName.EndsWith('/')) { continue }
              $stream = $entry.Open()
              try {
                $buffer = New-Object byte[] 65536
                while ($stream.Read($buffer, 0, $buffer.Length) -gt 0) { }
              } finally { $stream.Dispose() }
            }
          } finally {
            $archive.Dispose()
          }
          $checksumHash = (Get-FileHash -LiteralPath $checksum -Algorithm SHA256).Hash.ToLowerInvariant()
          "package_hash=$actualHash" >> $env:GITHUB_OUTPUT
          "package_size=$((Get-Item -LiteralPath $zip).Length)" >> $env:GITHUB_OUTPUT
          "checksum_hash=$checksumHash" >> $env:GITHUB_OUTPUT
          "checksum_size=$((Get-Item -LiteralPath $checksum).Length)" >> $env:GITHUB_OUTPUT
          Write-Host "Verified package SHA-256: $actualHash"
          Write-Host "Verified complete Windows ZIP and manifest."
      - name: Upload release assets to an unpublished draft
        id: draft-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: VBCCPAS Soft build ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/VBCCPAS-Soft-Windows.zip
            release-assets/VBCCPAS-Soft-Windows.zip.sha256
          draft: true
          generate_release_notes: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
      - name: Verify remote release assets and publish only after verification
        uses: actions/github-script@v7
        env:
          EXPECTED_PACKAGE_HASH: ${{ steps.verify-package.outputs.package_hash }}
          EXPECTED_PACKAGE_SIZE: ${{ steps.verify-package.outputs.package_size }}
          EXPECTED_CHECKSUM_HASH: ${{ steps.verify-package.outputs.checksum_hash }}
          EXPECTED_CHECKSUM_SIZE: ${{ steps.verify-package.outputs.checksum_size }}
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = `build-${context.sha}`;
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) throw new Error("Draft release ID was not returned by the upload step.");
            const { data: draft } = await github.rest.repos.getRelease({ owner, repo, release_id: releaseId });
            if (draft.tag_name !== tag) throw new Error(`Draft release tag mismatch: expected ${tag}, received ${draft.tag_name}.`);
            if (!draft.draft) throw new Error("Release is not a draft; refusing to change latest-release state.");
            const zip = draft.assets.find(asset => asset.name === "VBCCPAS-Soft-Windows.zip");
            const checksum = draft.assets.find(asset => asset.name === "VBCCPAS-Soft-Windows.zip.sha256");
            if (!zip || !checksum) throw new Error("Draft release is missing the complete Windows ZIP or checksum asset.");
            const expectedZipDigest = `sha256:${process.env.EXPECTED_PACKAGE_HASH}`;
            const expectedChecksumDigest = `sha256:${process.env.EXPECTED_CHECKSUM_HASH}`;
            if (zip.digest !== expectedZipDigest || zip.size !== Number(process.env.EXPECTED_PACKAGE_SIZE)) {
              throw new Error("Remote Windows ZIP digest or size does not match the locally verified build.");
            }
            if (checksum.digest !== expectedChecksumDigest || checksum.size !== Number(process.env.EXPECTED_CHECKSUM_SIZE)) {
              throw new Error("Remote SHA-256 sidecar digest or size does not match the locally verified file.");
            }
            const makeLatest = context.ref === "refs/heads/main";
            await github.rest.repos.updateRelease({
              owner, repo, release_id: draft.id, tag_name: tag,
              target_commitish: context.sha, draft: false,
              make_latest: makeLatest ? "true" : "false"
            });
            const { data: published } = await github.rest.repos.getRelease({ owner, repo, release_id: draft.id });
            if (published.draft) throw new Error("GitHub did not publish the verified release.");
            if (published.tag_name !== tag) throw new Error(`Published release tag mismatch: expected ${tag}, received ${published.tag_name}.`);
            if (makeLatest) {
              const { data: latest } = await github.rest.repos.getLatestRelease({ owner, repo });
              if (latest.id !== published.id) throw new Error("The verified main-branch build was published but did not become the latest release.");
            }
            core.info(`Published verified Windows release ${published.html_url}; latest=${makeLatest}.`);
