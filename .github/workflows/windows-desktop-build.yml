name: VBCCPAS Windows desktop build

on:
  push:
    branches:
      - feature/unified-windows-ui
      - feature/photographic-arts-theme
      - feature/one-click-windows-launcher
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile main.py desktop_app.py server.py passkey_auth.py problem_checker.py test_integration.py
      - name: Run isolated integration tests
        run: python test_integration.py
      - name: Run passkey safety checks
        run: python verify_data_flow.py
      - name: Check dashboard JavaScript
        run: python check_frontend.py

  windows-build:
    needs: integration
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Compile Windows application modules
        run: python -m py_compile main.py desktop_app.py server.py passkey_auth.py problem_checker.py
      - name: Build single-windowed desktop executable
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build desktop_app.spec
      - name: Add one-click shortcut setup files
        shell: pwsh
        run: |
          Copy-Item Create-Desktop-Shortcut.ps1 dist/ -Force
          Copy-Item Setup-VBCCPAS-Shortcut.bat dist/ -Force
      - name: Verify Windows desktop shortcut creation
        shell: pwsh
        run: |
          $shortcut = Join-Path $env:RUNNER_TEMP "VBCCPAS-Soft-test.lnk"
          ./Create-Desktop-Shortcut.ps1 -TargetExe "$PWD/dist/VBCCPAS-Soft.exe" -ShortcutPath $shortcut
          if (-not (Test-Path -LiteralPath $shortcut -PathType Leaf)) { throw "Shortcut was not created." }
      - name: Upload Windows application and launcher
        uses: actions/upload-artifact@v4
        with:
          name: VBCCPAS-Soft-Windows
          path: dist/*
          if-no-files-found: error
