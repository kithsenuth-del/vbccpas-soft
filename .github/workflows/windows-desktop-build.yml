name: VBCCPAS Windows desktop build

permissions:
  contents: write

on:
  push:
    branches:
      - feature/unified-windows-ui
      - feature/photographic-arts-theme
      - feature/one-click-windows-launcher
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt -r cloud_api/requirements.txt httpx==0.28.1
      - name: Compile Python modules
        run: python -m py_compile main.py desktop_app.py server.py passkey_auth.py problem_checker.py updater.py build_info.py test_integration.py database_migrations.py local_sync.py cloud_api/app.py cloud_api/bootstrap_admin.py tests/test_database_migrations.py tests/test_local_sync.py tests/test_cloud_api.py tests/test_passkey_recovery.py tests/test_updater.py tests/test_updater_package.py updater_app.py
      - name: Run isolated integration tests
        run: python test_integration.py
      - name: Test safe passkey registration recovery
        run: python tests/test_passkey_recovery.py
      - name: Test automatic updater release validation
        run: python tests/test_updater.py
      - name: Test safe full-application package extraction
        run: python tests/test_updater_package.py
      - name: Test non-destructive database migration foundation
        run: python -m unittest discover -s tests -p "test_database_migrations.py" -v
      - name: Test local-first sync engine
        run: python -m unittest discover -s tests -p "test_local_sync.py" -v
      - name: Test central API and device sync protocol
        run: python -m unittest discover -s tests -p "test_cloud_api.py" -v
      - name: Run passkey safety checks
        run: python verify_data_flow.py
      - name: Check dashboard JavaScript
        run: python check_frontend.py

  windows-build:
    needs: integration
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Run verified local Windows build script
        shell: pwsh
        run: .\\build_exes.ps1
      - name: Verify Windows desktop shortcut creation
        shell: pwsh
        run: |
          $shortcut = Join-Path $env:RUNNER_TEMP "VBCCPAS-Soft-test.lnk"
          ./Create-Desktop-Shortcut.ps1 -TargetExe "$PWD/dist/VBCCPAS-Soft.exe" -ShortcutPath $shortcut
          if (-not (Test-Path -LiteralPath $shortcut -PathType Leaf)) { throw "Shortcut was not created." }
      - name: Publish latest Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: VBCCPAS Soft build ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          files: dist/VBCCPAS-Soft-Windows.zip
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
      - name: Upload Windows application and launcher
        uses: actions/upload-artifact@v4
        with:
          name: VBCCPAS-Soft-Windows
          path: dist/*
          if-no-files-found: error
