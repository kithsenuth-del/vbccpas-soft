name: VBCCPAS integration tests

on:
  push:
    branches:
      - test/web-desktop-integration-suite
  pull_request:
    branches:
      - main

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m py_compile main.py server.py passkey_auth.py run_server.py test_integration.py tests/test_passkey_recovery.py
      - name: Run isolated web/desktop integration suite
        run: python test_integration.py
      - name: Test safe passkey registration recovery
        run: python tests/test_passkey_recovery.py
      - name: Run existing passkey safety checks
        run: python verify_data_flow.py
      - name: Check dashboard JavaScript syntax
        run: python check_frontend.py
