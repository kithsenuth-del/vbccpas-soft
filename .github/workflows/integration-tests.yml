name: VBCCPAS integration tests

on:
  push:
    branches:
      - test/web-desktop-integration-suite
  pull_request:
    branches:
      - main

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r cloud_api/requirements.txt httpx==0.28.1
      - name: Compile application and tests
        run: python -m py_compile main.py server.py passkey_auth.py run_server.py test_integration.py database_migrations.py local_sync.py cloud_api/app.py cloud_api/bootstrap_admin.py tests/test_database_migrations.py tests/test_local_sync.py tests/test_cloud_api.py tests/test_passkey_recovery.py tests/test_database_migrations.py
      - name: Run isolated web/desktop integration suite
        run: python test_integration.py
      - name: Test safe passkey registration recovery
        run: python tests/test_passkey_recovery.py
      - name: Test local-first sync engine
        run: python -m unittest discover -s tests -p "test_local_sync.py" -v
      - name: Test central API and device sync protocol
        run: python -m unittest discover -s tests -p "test_cloud_api.py" -v
      - name: Test non-destructive database migration foundation
        run: python -m unittest discover -s tests -p "test_database_migrations.py" -v
      - name: Run existing passkey safety checks
        run: python verify_data_flow.py
      - name: Check dashboard JavaScript syntax
        run: python check_frontend.py
